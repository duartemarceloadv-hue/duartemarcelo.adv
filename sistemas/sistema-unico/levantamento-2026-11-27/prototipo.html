<title>Operações Dr. Hair</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap">
<style>
/* Casca: menu lateral navy fixo + cabeçalho preso + página que rola inteira. Kit: 4 tamanhos de letra, 5 cores de situação. */
:root{
  --f1:20px; --f2:16px; --f3:14px; --f4:12px;
  --font:"Nunito Sans", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#F8FAFB; --paper:#FFFFFF;
  --fg:#1F2A33; --muted:#55636F; --line:#DCE2E8; --field:#8A96A3;
  --menu:#1B3A4B; --menu-fg:#D6E0E6; --menu-hover:#24495C; --gold:#C8A96E;
  --primary:#1B3A4B; --primary-ink:#FFFFFF; --focus:#1D5A85;
  --n:#4F5C69; --n-bg:#E9EDF1;
  --i:#1D5A85; --i-bg:#E2EDF6;
  --s:#1B6E41; --s-bg:#E0F1E6;
  --a:#855400; --a-bg:#FBEFD6;
  --d:#A8231A; --d-bg:#FBE7E5;
  --shadow:0 1px 2px rgba(20,35,45,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161C; --surface:#19212A; --surface-2:#1E2731; --paper:#F4F6F8;
  --fg:#E3E9EE; --muted:#A2AFBC; --line:#2A3540; --field:#6E7C8A;
  --menu:#0F2430; --menu-fg:#C3D0D8; --menu-hover:#1A3646; --gold:#C8A96E;
  --primary:#8CC2EA; --primary-ink:#0D1A25; --focus:#8CC2EA;
  --n:#B3BEC9; --n-bg:#26303A; --i:#8CC2EA; --i-bg:#1D3346; --s:#86D3A4; --s-bg:#173323;
  --a:#F0C46F; --a-bg:#3A2D14; --d:#F29B92; --d-bg:#3D1F1C; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#19212A; --surface-2:#1E2731; --paper:#F4F6F8;
  --fg:#E3E9EE; --muted:#A2AFBC; --line:#2A3540; --field:#6E7C8A;
  --menu:#0F2430; --menu-fg:#C3D0D8; --menu-hover:#1A3646; --gold:#C8A96E;
  --primary:#8CC2EA; --primary-ink:#0D1A25; --focus:#8CC2EA;
  --n:#B3BEC9; --n-bg:#26303A; --i:#8CC2EA; --i-bg:#1D3346; --s:#86D3A4; --s-bg:#173323;
  --a:#F0C46F; --a-bg:#3A2D14; --d:#F29B92; --d-bg:#3D1F1C; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--f3);line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,p{margin:0}
h1{font-size:var(--f1);font-weight:600;text-wrap:balance}
h2{font-size:var(--f2);font-weight:600}
small,.small{font-size:var(--f4)}
a{color:var(--i)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- casca ---------- */
.app{display:flex;min-height:100vh}
.menu{width:216px;flex:none;background:var(--menu);color:var(--menu-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px)}
.logo{height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--gold);font-weight:600;font-size:var(--f2);border-bottom:1px solid rgba(255,255,255,.08)}
.logo .mk{width:28px;height:28px;border:1.5px solid var(--gold);border-radius:6px;display:grid;place-items:center;font-size:var(--f4);flex:none}
.menu nav{display:flex;flex-direction:column;padding:10px 8px;gap:2px}
.mi{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:6px;color:var(--menu-fg);text-decoration:none;white-space:nowrap}
.mi:hover{background:var(--menu-hover)}
.mi svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mi.on{color:var(--gold);background:var(--menu-hover);font-weight:600}
.mi .cnt{margin-left:auto;background:var(--gold);color:#1B3A4B;font-size:var(--f4);font-weight:600;border-radius:10px;padding:0 7px;line-height:20px}
.sub{display:flex;flex-direction:column;padding:0 0 4px 42px;gap:0}
.sub a{color:var(--menu-fg);text-decoration:none;font-size:var(--f4);line-height:28px;padding:0 8px;border-radius:4px}
.sub a.on{color:var(--gold);font-weight:600}
.sub a:hover{background:var(--menu-hover)}
.menu .rod{margin-top:auto;padding:12px 18px;font-size:var(--f4);color:var(--menu-fg);opacity:.8}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.proto{background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:6px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));font-size:var(--f4);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--field);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:2px 10px;font-size:var(--f4);cursor:pointer;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);font-weight:600}
header.cab{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.cab .esp{flex:1}
.uwrap{position:relative}
.ubtn{height:36px;display:flex;align-items:center;gap:8px;border:1px solid var(--field);background:var(--surface);border-radius:6px;padding:0 10px;cursor:pointer;max-width:300px}
.ubtn .lb{color:var(--muted);font-size:var(--f4)}
.ubtn .vl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubtn.rest{background:var(--i-bg);border-color:var(--i)}
.ubtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.limpar{border:0;background:none;color:var(--i);cursor:pointer;font-weight:600;padding:0 4px}
.upop{position:absolute;top:42px;left:0;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px;width:280px;max-width:calc(100vw - 32px)}
.upop label{display:flex;align-items:center;gap:10px;height:36px;padding:0 8px;border-radius:4px;cursor:pointer}
.upop label:hover{background:var(--surface-2)}
.upop .gr{font-size:var(--f4);color:var(--muted);padding:6px 8px 2px}
.upop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.upop .ok{display:flex;justify-content:flex-end;padding-top:6px}
.mes select,.campo select,.campo input,textarea{height:36px;border:1px solid var(--field);border-radius:6px;background:var(--surface);padding:0 10px}
textarea{height:auto;min-height:72px;padding:8px 10px;width:100%;resize:vertical}
.usr{width:36px;height:36px;border-radius:50%;border:1px solid var(--field);background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:var(--f4);cursor:pointer;flex:none}
.usrpop{position:absolute;right:0;top:44px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;width:200px}
.usrpop .nm{padding:6px 10px;font-weight:600}
.usrpop .pf{padding:0 10px 6px;color:var(--muted);font-size:var(--f4)}
.usrpop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:4px;cursor:pointer}
.usrpop button:hover{background:var(--surface-2)}
.vercomo{background:var(--a-bg);color:var(--a);border-bottom:1px solid var(--line);font-weight:600;padding-block:6px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

.pg{padding-block:20px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.tit{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tit .ac{display:flex;gap:8px;flex-wrap:wrap}
.atual{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:var(--f4);margin-top:-10px}
.migalha{font-size:var(--f4);color:var(--muted);margin-bottom:-10px}
.migalha a{color:var(--muted)}

/* botões */
.btn{height:36px;border-radius:6px;border:1px solid var(--field);background:var(--surface);padding:0 14px;cursor:pointer;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.lnk{border-color:transparent;background:none;color:var(--i);padding:0 6px}
.btn.sm{height:28px;padding:0 10px;font-size:var(--f4)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* selos */
.selo{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:var(--f4);font-weight:600;white-space:nowrap}
.selo.n{color:var(--n);background:var(--n-bg)} .selo.i{color:var(--i);background:var(--i-bg)}
.selo.s{color:var(--s);background:var(--s-bg)} .selo.a{color:var(--a);background:var(--a-bg)}
.selo.d{color:var(--d);background:var(--d-bg)}

/* fichas de contagem / abas */
.abas{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.abas button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font-weight:600}
.abas button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--primary)}
.abas .q{font-weight:400;color:var(--muted);margin-left:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chip b{font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--i-bg)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.card .r{font-size:var(--f4);color:var(--muted)}
.card .v{font-size:var(--f1);font-weight:600}
.card[aria-pressed="true"]{border-color:var(--primary)}

/* filtros */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.campo{display:flex;flex-direction:column;gap:2px}
.campo label{font-size:var(--f4);color:var(--muted)}
.campo.busca{flex:1 1 220px;min-width:0}
.campo.busca input{width:100%}
.ativos{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:var(--f4);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 10px;border-radius:12px;background:var(--i-bg);color:var(--i);font-weight:600}
.tag button{border:0;background:none;color:inherit;cursor:pointer;width:20px;height:20px;border-radius:50%;line-height:1}
.mais{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;gap:12px;flex-wrap:wrap}

/* tabela padrão: 8 colunas no máximo, linha 40 px */
.tabela{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;table-layout:auto}
th{font-size:var(--f4);font-weight:600;color:var(--muted);text-align:left;padding:0 12px;height:36px;border-bottom:1px solid var(--line);white-space:nowrap}
td{height:40px;padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
tbody tr:last-child td{border-bottom:0}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover td{background:var(--surface-2)}
td.id{font-weight:600}
.num{text-align:right}
td.chk,th.chk{width:40px;padding-right:0}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:var(--surface-2)}
.vazio{padding:28px 16px;text-align:center;color:var(--muted)}
.mostrar{display:flex;justify-content:center;padding:8px}
.lote{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:5;background:var(--primary);color:var(--primary-ink);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lote .btn{height:28px;font-size:var(--f4)}
.confirma{background:var(--a-bg);color:var(--fg);border:1px solid var(--a);border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.aviso{border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid}
.aviso.d{background:var(--d-bg);border-color:var(--d);color:var(--fg)}
.aviso.s{background:var(--s-bg);border-color:var(--s)}
.aviso.i{background:var(--i-bg);border-color:var(--i)}
.aviso .tx{flex:1 1 260px;min-width:0}
.aviso strong{font-weight:600}

/* ficha */
.fcab{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fcab .l1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fcab .l1 .ac{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;position:relative}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv dt,.kv .k{font-size:var(--f4);color:var(--muted)}
.kv dd,.kv .v{margin:0;overflow-wrap:anywhere}
.kv2{grid-template-columns:repeat(2,minmax(0,1fr))}
.falta{background:var(--a-bg);border:1px solid var(--a);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.falta .it{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ancoras{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:var(--f4)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;scroll-margin-top:72px}
.sec>h2{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec .cp{padding:12px 16px}
.sec .tabela{border:0;box-shadow:none;border-radius:0}
.arqs{list-style:none;margin:0;padding:0}
.arqs li{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 16px;border-bottom:1px solid var(--line)}
.arqs li:last-child{border-bottom:0}
.arqs .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.arqs .mt{color:var(--muted);font-size:var(--f4)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:140px 1fr;gap:4px 16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .q{font-size:var(--f4);color:var(--muted)}
.hist .j{font-size:var(--f4);color:var(--muted);grid-column:2}
.maispop{position:absolute;right:0;top:42px;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;width:220px}
.maispop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:4px;cursor:pointer}
.maispop button:hover{background:var(--surface-2)}
.maispop .perigo{color:var(--d)}

/* decisão e visualizador */
.dec{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,3fr);gap:16px;align-items:start}
.folha{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.folha .barra{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:var(--f4);color:var(--muted);gap:8px;flex-wrap:wrap}
.papel{background:var(--paper);color:#1F2A33;width:100%;max-width:640px;aspect-ratio:1/1.3;border:1px solid #DCE2E8;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:7% 8%;display:flex;flex-direction:column;gap:14px}
.papel .pt{display:flex;justify-content:space-between;gap:12px;border-bottom:1.5px solid #1F2A33;padding-bottom:10px}
.papel .pt b{font-size:var(--f2)}
.papel .pl{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted #B5BFC8;padding:4px 0}
.papel .pl span:first-child{color:#55636F}
.papel .tot{margin-top:auto;display:flex;justify-content:space-between;font-weight:600;font-size:var(--f2);border-top:1.5px solid #1F2A33;padding-top:10px}
.papel .ass{font-size:var(--f4);color:#55636F}
.painel{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column}
.painel>div{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.painel>div:last-child{border-bottom:0}
.painel .kv{grid-template-columns:1fr}
.botoes{display:flex;flex-direction:column;gap:8px}
.botoes .btn{width:100%}
.regra{border-radius:6px;padding:8px 10px;background:var(--s-bg);color:var(--s);font-weight:600;font-size:var(--f4)}
.regra.a{background:var(--a-bg);color:var(--a)}
.feito{background:var(--s-bg);border:1px solid var(--s);border-radius:6px;padding:10px;color:var(--fg)}
.usado li{min-height:32px}
.erro{color:var(--d);font-size:var(--f4);font-weight:600}

/* documentos: matriz */
.legenda{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:var(--f4);color:var(--muted)}
.mtx td{text-align:left}
.mtx th:not(:first-child){white-space:normal;line-height:1.2;padding-block:4px}
.cel{border:0;background:none;padding:0;cursor:pointer}

/* placeholder */
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px;max-width:720px}
.lista-mais{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.lista-mais a{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.lista-mais a:last-child{border-bottom:0}
.lista-mais svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}

/* barra inferior (celular) */
.barinf{display:none}
.decbar{display:none}

@media (max-width:1279px){
  .menu{width:64px}
  .logo span:not(.mk),.mi .tx,.sub,.menu .rod{display:none}
  .logo{padding:0;justify-content:center}
  .mi{justify-content:center;padding:0;position:relative}
  .mi .cnt{position:absolute;top:2px;right:4px;margin:0;padding:0 5px;line-height:16px}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1100px){.dec{grid-template-columns:1fr}}
@media (min-width:861px) and (max-width:1279px){.c2{display:none}}
@media (max-width:860px){
  .menu{display:none}
  .proto,header.cab,.pg,.vercomo{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pg{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .ubtn{max-width:170px} .ubtn .lb{display:none}
  header.cab{gap:8px}
  .mes select{max-width:136px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv,.kv2{grid-template-columns:1fr 1fr}
  .tit .ac .btn.pri{display:none}
  .tit .ac .sec-m{display:none}
  .ficha-pri{display:flex!important}
  .barinf{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

   + '</tbody><tfoot><tr><td class="id">Total</td><td class="mh"></td><td class="num" data-l="Valor">'+brl(parc.reduce((s,x)=>s+x.val,0))+'</td>'+(op?'<td class="mh"></td><td class="mh"></td><td class="mh"></td>':'')+'<td class="mh"></td><td class="mh"></td></tr></tfoot></table></div></section>';

   + '<tr><td class="id">NF 000.118</td><td data-l="Emissão">14/11/2026</td><td class="num" data-l="Valor">'+brl(14437.11)+'</td><td data-l="Conferência">'+selo('s','Confere')+'</td><td class="acao"><a class="btn sm" href="#visualizar">Ver nota</a></td></tr></tbody></table></div></section>';
  h += '<section class="sec" id="s-anexos"><h2>Outros anexos</h2><ul class="arqs">'
   + [['Pedido de venda do laboratório','PDF · enviado em 12/11/2026 por Pessoa Exemplo'],['Comprovante de pagamento da parcela 1/3','PDF · enviado em 21/11/2026 por Pessoa Exemplo 1']].map(a=>'<li><span class="nm">'+a[0]+'<br><span class="mt">'+a[1]+'</span></span><a class="btn sm" href="#visualizar">Ver</a></li>').join('')

function bindFicha(pg){
  pg.querySelectorAll('[data-anc]').forEach(a=>a.onclick=e=>{e.preventDefault();const s=document.getElementById('s-'+a.dataset.anc); if(s) s.scrollIntoView({behavior:'smooth'});});
  const m=document.getElementById('f-maisac'); if(m) m.onclick=()=>{S.maisAcoes=!S.maisAcoes;render();};
  const r=document.getElementById('f-res'); if(r) r.onclick=()=>abrirPend(1);
  const u=document.getElementById('ulimpar2'); if(u) u.onclick=()=>setSel(null);
}

function telaDocs(){
  const us = ativas().map(id=>UNID.find(u=>u.id===id));
  const cont = {d:0,a:0,i:0,n:0};
  us.forEach(u=>MTX[u.id].forEach(x=>{const e=estDoc(x)[0]; if(cont[e]!=null) cont[e]++;}));
  const cards=[['d','Vencidos'],['a','Vencem em até 30 dias'],['i','Vencem em até 60 dias'],['n','Não enviados']];
  let h = '<div class="tit"><h1>Documentos por unidade</h1><div class="ac"><button type="button" class="btn pri">Enviar documento</button></div></div>'
   + '<div class="atual">Atualizado em 27/11/2026 07:40 · rotina de vencimentos</div>'
   + '<div class="cards">'+cards.map(c=>'<button type="button" class="card" data-df="'+c[0]+'" aria-pressed="'+(S.dFiltro===c[0])+'"><span class="r">'+c[1]+'</span><span class="v">'+cont[c[0]]+'</span><span class="r">de '+(us.length*TIPOS.length)+' documentos</span></button>').join('')+'</div>'
   + '<div class="legenda">Situação: '+selo('s','Válido')+selo('i','60 dias')+selo('a','30 dias')+selo('d','Vencido')+selo('n','Não enviado')
   + (S.dFiltro?'<span class="tag">Mostrando só: '+cards.find(c=>c[0]===S.dFiltro)[1]+'<button type="button" aria-label="Remover filtro" id="df-x">×</button></span>':'')+'</div>';
  h += '<div class="tabela cartoes mtx"><table><thead><tr><th>Unidade</th>'+TIPOS.map(t=>'<th>'+t+'</th>').join('')+'</tr></thead><tbody>'
   + us.map(u=>'<tr><td class="id">'+u.nome+'</td>'+TIPOS.map((t,i)=>{const x=MTX[u.id][i],e=estDoc(x); const mostra=!S.dFiltro||e[0]===S.dFiltro;
       const tip = x==null?'Não enviado':(x<0?'Venceu há '+(-x)+' dias':'Vence em '+x+' dias');
       return '<td data-l="'+t+'"'+(mostra?'':' class="mh"')+'>'+(mostra?'<button type="button" class="cel" title="'+tip+'">'+selo(e[0],e[1])+'</button>':'<span aria-hidden="true" style="color:var(--line)">·</span>')+'</td>';}).join('')+'</tr>').join('')
   + '</tbody></table></div>';
  return h;
}
function bindDocs(pg){
  pg.querySelectorAll('[data-df]').forEach(b=>b.onclick=()=>{S.dFiltro=S.dFiltro===b.dataset.df?null:b.dataset.df;render();});
  const x=document.getElementById('df-x'); if(x) x.onclick=()=>{S.dFiltro=null;render();};
}

function semAcesso(){ return '<div class="tit"><h1>Sem acesso</h1></div><div class="bloco">Esta área é só da Operações. <a href="#pendencias">Voltar às pendências</a></div>'; }
function telaRotinas(){
  if(S.perfil!=='op') return semAcesso();
  const falhas = ROT.filter(r=>r.st[0]==='d');
  let h = '<div class="migalha"><a href="#configuracoes">Configurações</a> / Rotinas</div><div class="tit"><h1>Rotinas</h1></div>';
  falhas.forEach(r=>{ h += '<div class="aviso d" role="alert"><span class="tx"><strong>'+r.n+' sem dados há 2 dias.</strong> Última leitura em '+fdh(r.ul)+'. Sem ela, as parcelas ficam sem a confirmação do laboratório. Abra o portal no computador que faz a leitura e rode de novo.</span><button type="button" class="btn sm">Rodar agora</button></div>'; });
  h += '<div class="tabela cartoes"><table><thead><tr><th>Rotina</th><th>Quando roda</th><th>Atualizado em</th><th class="c2">Resultado</th><th>Situação</th><th></th></tr></thead><tbody>'
   + ROT.map(r=>'<tr><td class="id" title="Fonte: '+r.f+' · próxima: '+r.px+'">'+r.n+'</td><td data-l="Quando roda">'+r.q+'</td><td data-l="Atualizado em">'+fdh(r.ul)+'</td><td class="c2" data-l="Resultado">'+r.l+'</td><td class="st">'+selo(r.st[0],r.st[1])+'</td><td class="acao"><button type="button" class="btn sm">Rodar agora</button></td></tr>').join('')
   + '</tbody></table></div>';
  return h;
}
function telaCfg(){
  if(S.perfil!=='op') return semAcesso();
  return '<div class="tit"><h1>Configurações</h1></div><div class="lista-mais">'
   + [['rotinas','Rotinas','Robôs, horários e falhas'],['seguranca','Segurança e acessos','Quem acessa o quê, último acesso, verificação em duas etapas'],['lixeira','Lixeira','Itens excluídos nos últimos 90 dias']].map(x=>'<a href="#'+x[0]+'"><span style="flex:1"><b>'+x[1]+'</b><br><span class="small" style="color:var(--muted)">'+x[2]+'</span></span></a>').join('')+'</div>';
}
function placeholder(t, texto, extra){
  return '<div class="tit"><h1>'+t+'</h1></div><div class="bloco"><p>'+texto+'</p>'+(extra||'')+'</div>';
}
function telaMais(){
  const fora = MENU.filter(m=>!(m.op&&S.perfil!=='op') && !BARRA[S.perfil].includes(m.h));
  return '<div class="tit"><h1>Mais</h1></div><div class="lista-mais">'+fora.map(m=>'<a href="#'+m.h+'">'+svg(m.i)+'<span>'+m.t+'</span></a>').join('')+'</div>';
}

/* ---------- roteador ---------- */
function render(){
  const r = rota();
  document.body.className = 'r-'+r;
  document.getElementById('pf-op').setAttribute('aria-pressed', S.perfil==='op');
  document.getElementById('pf-socio').setAttribute('aria-pressed', S.perfil==='socio');
  document.getElementById('usr-pf').textContent = S.perfil==='op'?'Operações':'Sócio';
  document.getElementById('mes').hidden = r!=='compras';
  if(r!=='decisao'){ document.getElementById('decbar').innerHTML=''; }
  renderMenu(); renderUnid();
  const pg = document.getElementById('pg');
  const T = {
    pendencias:[telaPend,bindPend], decisao:[telaDecisao,bindDecisao], pedidos:[telaPedidos,bindPedidos],
    pedido:[telaFicha,bindFicha], visualizar:[telaVisual], documentos:[telaDocs,bindDocs], rotinas:[telaRotinas],
    configuracoes:[telaCfg], mais:[telaMais],
    premiacao:[()=>placeholder('Premiação','A Premiação continua no sistema atual até a fase de login único. Ela abre em nova aba, com o login próprio dela. Nenhum número da Premiação aparece aqui.','<div><a class="btn pri" href="#premiacao" aria-disabled="true">Abrir a Premiação em nova aba</a></div>')],
    compras:[()=>placeholder('Contagem mensal de estoque','Exemplo de módulo mensal: o seletor de mês aparece no cabeçalho só aqui. Tela ainda não desenhada no protótipo.')],
    pops:[()=>placeholder('POPs','Biblioteca, emissões e POPs específicos. Tela ainda não desenhada no protótipo.')],
    reembolsos:[()=>placeholder('Reembolsos','Solicitações e pagamentos. A aprovação aparece na Central de pendências.','<div><a class="btn" href="#pendencias">Ir para as pendências</a></div>')],
    cadastros:[()=>S.perfil!=='op'?semAcesso():placeholder('Cadastros','Unidades e empresas, pessoas, sócios, responsáveis técnicos, fornecedores e laboratórios, produtos.')],
    seguranca:[()=>S.perfil!=='op'?semAcesso():placeholder('Segurança e acessos','Quem tem acesso a quê, último acesso, verificação em duas etapas e último backup testado.')],
    lixeira:[()=>S.perfil!=='op'?semAcesso():placeholder('Lixeira','Itens excluídos nos últimos 90 dias. Restaurar fica no histórico.')]
  };
  const t = T[r] || T.pendencias;
  pg.innerHTML = t[0]();
  if(t[1]) t[1](pg);
  if(r==='decisao') bindDecisao(pg);
}
document.getElementById('pf-op').onclick=()=>{S.perfil='op';S.lote.clear();S.feitoMsg=null;S.motivo=null;render();};
document.getElementById('pf-socio').onclick=()=>{S.perfil='socio';S.lote.clear();S.feitoMsg=null;S.motivo=null;S.fSit='';render();};
const usr=document.getElementById('usr'), usrpop=document.getElementById('usrpop');
usr.onclick=()=>{usrpop.hidden=!usrpop.hidden; usr.setAttribute('aria-expanded',!usrpop.hidden);};
document.addEventListener('click',e=>{
  if(!e.target.isConnected) return;
  if(!usr.contains(e.target)&&!usrpop.contains(e.target)) usrpop.hidden=true;
  const w=document.getElementById('uwrap'); if(S.upop && !w.contains(e.target)){S.upop=false;renderUnid();}
  if(S.maisAcoes && !e.target.closest('.fcab .ac')){S.maisAcoes=false;render();}
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ usrpop.hidden=true; if(S.upop){S.upop=false;renderUnid();} } });
window.addEventListener('hashchange',()=>{ S.feitoMsg=null; S.motivo=null; S.maisAcoes=false; render(); window.scrollTo(0,0); });
render();
})();
</script>
