  var labs={}; D.lab.forEach(function(l){labs[l[0]]={id:l[0],nome:l[0]==='CP'?'Centro Paulista':l[1],nomeLongo:l[1],prazo:l[2],numNome:l[3],cond:l[4]}});
  D.labs=labs;
  PED=D.ped.map(function(a,i){return {i:i,num:a[0],numLab:a[1],lab:a[2],un:D.un[a[3]],env:a[4],prev:a[5],conf:a[6],exp:a[7],rast:a[8],rec:a[9],frete:a[10],sub:a[11],total:a[10]+a[11],sit:a[12],atraso:a[13],cancMot:a[14],obs:a[15]==null?null:D.obs[a[15]],leg:a[16],etapa:a[17],etapaPrev:a[18],tipo:a[19],recObs:a[20],itens:[],parc:[],nf:[],arq:[]}});
  D.it.forEach(function(a){var pr=D.prod[a[1]];PED[a[0]].itens.push({prod:pr[1],qtd:a[2],preco:a[3],total:Math.round(a[2]*a[3]*100)/100})});
  PARC=D.parc.map(function(a,k){var p=PED[a[0]];var o={k:k,p:p,n:a[1],de:a[2],venc:a[3],valor:a[4],forma:a[5],bPlan:a[6],bOmie:a[7],sit:a[8],pago:a[9],pagoEm:a[10],orig:a[11],cancMot:a[12]};
    o.prox7=(o.sit==='A'&&o.venc<=h7);p.parc.push(o);return o});
  D.nf.forEach(function(a){var o={num:a[0],emis:a[1],total:a[2],frete:a[3],canc:a[4],lab:a[5]};(a[6]||[]).forEach(function(i){PED[i].nf.push(o)})});
  D.arq.forEach(function(a){PED[a[0]].arq.push({nome:a[1],cat:CAT[a[2]],subst:a[3]})});
  PED.forEach(function(p){
    p.prazo=p.prev||(p.env?addD(p.env,labs[p.lab].prazo):null);
    p.diasCaminho=(p.sit==='C'&&p.exp)?dias(p.exp,HOJE):0;
    p.labDizEnviou=(p.sit==='E'&&p.etapa&&/^(ENVIADO|RETIRA)/i.test(p.etapa));
    p.acoes=acoesDo(p);
    p.urg=p.acoes.length?p.acoes[0].peso:0;
  });
}

/* o que fazer em cada pedido, do mais urgente para o menos */
function acoesDo(p){
  var a=[]; if(p.sit==='X') return a;
  var cnt=function(s){var l=p.parc.filter(function(x){return x.sit===s});return {n:l.length,v:l.reduce(function(t,x){return t+x.valor},0)}};
  var v=cnt('V'); if(v.n) a.push({peso:100,cor:'--red',txt:'Pagar '+plural(v.n,'parcela vencida','parcelas vencidas')+' — '+R(v.v)});
  if(p.atraso>0) a.push({peso:60+Math.min(p.atraso,39),cor:'--red',txt:'Cobrar laboratório — '+plural(p.atraso,'dia','dias')+' além do prazo'});
  var a7=p.parc.filter(function(x){return x.prox7});
  if(a7.length) a.push({peso:58,cor:'--blue',txt:'Pagar até '+dt(a7[0].venc)+' — '+R(a7.reduce(function(t,x){return t+x.valor},0))});
  if(p.diasCaminho>7) a.push({peso:50,cor:'--amber',txt:'Confirmar recebimento — a caminho há '+p.diasCaminho+' dias'});
  if(p.labDizEnviou) a.push({peso:45,cor:'--amber',txt:'Confirmar recebimento — o laboratório marcou “'+p.etapa.toLowerCase()+'”, mas não temos a data de envio'});
  var pb=cnt('P'); if(pb.n) a.push({peso:35,cor:'--amber',txt:'Cobrar baixa do laboratório — '+plural(pb.n,'parcela paga','parcelas pagas')+' sem baixa'});
  var b=cnt('B'); if(b.n) a.push({peso:30,cor:'--amber',txt:'Anexar comprovante — '+plural(b.n,'parcela baixada','parcelas baixadas')+' sem comprovante nosso'});
  if(p.sub===0) a.push({peso:25,cor:'--gray',txt:'Completar itens — pedido sem itens cadastrados'});
  a.sort(function(x,y){return y.peso-x.peso}); return a;
}

/* ---------- cartões do Início ---------- */

  return [
   {g:'Financeiro',itens:[
    {id:'B',acao:'Anexar comprovante',det:'O laboratório já deu baixa, mas não temos o comprovante do nosso pagamento.',c:'--amber',r:pc(function(x){return x.sit==='B'}),ir:['pagamentos','B']},

    {id:'V',acao:'Pagar — vencidas de verdade',det:'Venceram, não têm pagamento nosso nem baixa do laboratório.',c:'--red',r:pc(function(x){return x.sit==='V'}),ir:['pagamentos','V']},
    {id:'A7',acao:'Pagar — vencem nos próximos 7 dias',det:'Vencem até '+dt(h7)+'.',c:'--blue',r:pc(function(x){return x.prox7}),ir:['pagamentos','A7']}]},
   {g:'Laboratório',itens:[
    {id:'atraso',acao:'Cobrar laboratório — passou do prazo de 30 dias',det:'Ainda não saíram do laboratório e já passou o prazo.',c:'--red',r:pd(function(p){return p.atraso>0&&p.sit!=='R'&&p.sit!=='X'}),ir:['pedidos','atraso']},
    {id:'caminho',acao:'Confirmar entrega — a caminho há mais de 7 dias',det:'Saíram do laboratório há mais de uma semana e ninguém confirmou a chegada.',c:'--amber',r:pd(function(p){return p.diasCaminho>7}),ir:['pedidos','caminho']}]},
   {g:'Cadastro',itens:[
    {id:'semitens',acao:'Completar itens — pedidos sem itens',det:'Sem produtos cadastrados, o total aparece zerado.',c:'--gray',r:pd(function(p){return p.sub===0&&p.sit!=='X'}),ir:['pedidos','semitens'],semValor:true},
    {id:'labEnviou',acao:'Confirmar recebimento',det:'O laboratório marcou como enviado, mas não temos data de envio nem de entrega.',c:'--amber',r:pd(function(p){return p.labDizEnviou}),ir:['pedidos','labEnviou']}]}
  ];
}

function filtrarPedidos(){
  var b=estado.busca.trim().toLowerCase();
  return PED.filter(function(p){
    if(estado.especial&&!FILTRO_FN[estado.especial](p))return false;
    if(estado.sit&&p.sit!==estado.sit)return false;
    if(estado.lab&&p.lab!==estado.lab)return false;
    if(estado.acao&&!p.acoes.length)return false;
    if(b&&(p.num+' '+(p.numLab||'')+' '+p.un).toLowerCase().indexOf(b)<0)return false;
    return true;
  }).sort(function(x,y){return y.urg-x.urg||(y.atraso-x.atraso)||((y.env||'')>(x.env||'')?1:-1)});
}

     '<span class="c-dh dh">'+esc(p.num)+'<span class="nl">lab. '+esc(p.numLab||'—')+'</span></span>'+

  {id:'P',f:function(x){return x.sit==='P'}},

/* ---------- ficha do pedido ---------- */
function ficha(p){

  var vencidas=p.parc.some(function(x){return x.sit==='V'});
  var canc=p.sit==='X';
  var et=[
    {n:'Pedido',d:dt(p.env),e:'enviado ao laboratório',c:p.env?'ok':''},
    {n:'Pagamento',d:ativas.length?(pagas+' de '+ativas.length+' pagas'):'sem parcelas',e:pagoEm?'1º pagamento '+dt(pagoEm):(ativas.some(function(x){return x.sit==='B'})?'baixa do lab., sem comprovante':''),c:vencidas?'ruim':(ativas.length&&pagas===ativas.length?'ok':(ativas.length?'atencao':''))},
    {n:'Laboratório',d:p.conf?dt(p.conf):(p.etapa?p.etapa.charAt(0)+p.etapa.slice(1).toLowerCase():'—'),e:p.atraso>0?p.atraso+' dias além do prazo ('+dt(p.prazo)+')':(p.prazo&&!p.exp?'prazo '+dt(p.prazo):''),c:p.atraso>0?'ruim':(p.exp||p.rec?'ok':'atencao')},
    {n:'Envio',d:dt(p.exp),e:p.rast?'rastreio '+p.rast:(p.diasCaminho?'há '+p.diasCaminho+' dias':''),c:p.exp?(p.diasCaminho>7?'atencao':'ok'):''},
    {n:'Entrega',d:dt(p.rec),e:p.rec?'recebido na unidade':'',c:p.rec?'ok':''}];
  if(canc) et.forEach(function(x){if(!x.c||x.c==='atencao'||x.c==='ruim')x.c='x'});
  var h='<div class="f-cab"><div class="tt"><h2>'+esc(p.num)+'</h2><div class="meta">'+esc(p.un)+' · '+esc(lab.nome)+' · '+esc(lab.numNome)+': '+esc(p.numLab||'—')+'</div><div style="margin-top:6px">'+tag(SIT_P[p.sit])+'</div></div><button type="button" class="fechar" id="fechar" aria-label="Fechar ficha">×</button></div><div class="f-corpo">';
  if(p.acoes.length){
    h+='<div class="sec" style="border-left:4px solid var('+p.acoes[0].cor+')"><h4>O que fazer agora</h4>'+p.acoes.map(function(a){return '<div style="margin-bottom:4px">→ <b>'+esc(a.txt)+'</b></div>'}).join('')+'</div>';
  }
  if(canc) h+='<div class="sec"><h4>Cancelado</h4><div>'+esc(p.cancMot||'Motivo não informado')+'</div></div>';
  h+='<div class="sec"><h4>Linha do tempo</h4><ol class="tempo">'+et.map(function(x){return '<li class="'+x.c+'"><b>'+x.n+'</b><span>'+esc(x.d)+'</span>'+(x.e?'<em>'+esc(x.e)+'</em>':'')+'</li>'}).join('')+'</ol>'+
   '<div class="origem">Origem: datas migradas do sistema antigo'+(p.etapa?'; etapa “'+esc(p.etapa)+'” veio da planilha do laboratório'+(p.etapaPrev?' (previsão '+dt(p.etapaPrev)+')':''):'')+'. Prazo do laboratório: '+lab.prazo+' dias corridos a partir do envio'+(p.prev?' (aqui vale a previsão informada)':'')+'.</div></div>';
  // itens
  h+='<div class="sec"><h4>Itens <small>'+plural(p.itens.length,'produto','produtos')+'</small></h4>';
  if(p.itens.length){
    h+='<table class="t"><thead><tr><th>Produto</th><th class="r">Qtd</th><th class="r">Preço</th><th class="r">Total</th></tr></thead><tbody>'+
     p.itens.map(function(it){return '<tr><td>'+esc(it.prod)+'</td><td class="r">'+it.qtd.toLocaleString('pt-BR')+'</td><td class="r">'+R(it.preco)+'</td><td class="r">'+R(it.total)+'</td></tr>'}).join('')+
     '</tbody><tfoot><tr><td colspan="3">Produtos</td><td class="r">'+R(p.sub)+'</td></tr><tr><td colspan="3" style="font-weight:400">Frete</td><td class="r" style="font-weight:400">'+R(p.frete)+'</td></tr><tr><td colspan="3">Total do pedido</td><td class="r">'+R(p.total)+'</td></tr></tfoot></table>';
  } else h+='<div style="color:var(--muted)">Nenhum item cadastrado. No sistema antigo este pedido não tinha os produtos lançados.</div><div class="acoes-f"><button type="button" class="botao mini" data-acao="itens">Completar itens</button></div>';
  h+='<div class="origem">Origem: itens e preços migrados do sistema antigo (preço congelado na data do pedido).</div></div>';
  // parcelas
  h+='<div class="sec"><h4>Parcelas <small>'+R(p.parc.reduce(function(t,x){return t+x.valor},0))+' cobrados pelo laboratório</small></h4>';
  if(!p.parc.length) h+='<div style="color:var(--muted)">Nenhuma parcela cadastrada.</div>';
  p.parc.forEach(function(x){
    var s=SIT_PC[x.sit]; var btn=x.prox7?'Pagar esta parcela':s[3];
    var bx=[]; if(x.bPlan)bx.push('baixa na planilha do laboratório em '+dt(x.bPlan)); if(x.bOmie)bx.push('baixa na Omie em '+dt(x.bOmie));
    h+='<div class="parc"><div><b>Parcela '+x.n+' de '+x.de+'</b> · vence '+dt(x.venc)+' · '+esc(FORMA[x.forma]||x.forma)+'</div><div class="v">'+R(x.valor)+'</div>'+
     '<div class="d">'+(x.pago?'Pago por nós: '+R(x.pago)+(x.pagoEm?' em '+dt(x.pagoEm):'')+' (com comprovante)':'Sem pagamento nosso registrado')+(bx.length?' · '+bx.join(' · '):' · sem baixa do laboratório')+(x.cancMot?' · '+esc(x.cancMot):'')+'</div>'+
     '<div class="a">'+tag(x.prox7?['Vence em até 7 dias','t-blue']:s)+(btn?'<button type="button" class="botao mini" data-acao="'+x.sit+'">'+esc(btn)+'</button>':'')+'</div>'+
     '<div class="d" style="color:var(--faint)">Origem: '+ORIG_PC[x.orig]+'. Situação calculada pelo sistema, não digitada.</div></div>';
  });
  h+='</div>';
  // notas
  h+='<div class="sec"><h4>Notas fiscais <small>'+plural(p.nf.length,'nota','notas')+'</small></h4>';
  if(p.nf.length) h+='<table class="t"><thead><tr><th>Número</th><th>Emissão</th><th class="r">Frete</th><th class="r">Total</th></tr></thead><tbody>'+p.nf.map(function(n){return '<tr><td>'+esc(n.num)+(n.canc?' '+tag(['Cancelada','t-gray']):'')+'</td><td>'+dt(n.emis)+'</td><td class="r">'+R(n.frete)+'</td><td class="r">'+R(n.total)+'</td></tr>'}).join('')+'</tbody></table>';
  else h+='<div style="color:var(--muted)">Nenhuma nota fiscal ligada a este pedido.</div>';
  h+='<div class="origem">Origem: notas migradas do sistema antigo e do Portal Omie.</div></div>';
  // anexos
  h+='<div class="sec"><h4>Anexos <small>'+plural(p.arq.length,'arquivo','arquivos')+'</small></h4>';
  if(p.arq.length) h+='<ul class="arqs">'+p.arq.map(function(a){return '<li><span class="nm">'+esc(a.nome)+(a.subst?' <span class="tag t-gray">substituído</span>':'')+'</span><span class="ct">'+esc(a.cat)+'</span></li>'}).join('')+'</ul>';
  else h+='<div style="color:var(--muted)">Nenhum arquivo anexado.</div>';
  h+='<div class="origem">Origem: arquivos trazidos do sistema antigo. Aqui só aparecem nome e tipo; no sistema real eles abrem para conferência.</div></div>';
  // dados gerais
  h+='<div class="sec"><h4>Dados do pedido</h4><dl class="kv"><dt>Nº interno</dt><dd>'+esc(p.num)+'</dd><dt>'+esc(lab.numNome)+'</dt><dd>'+esc(p.numLab||'—')+'</dd><dt>Laboratório</dt><dd>'+esc(lab.nomeLongo)+'</dd><dt>Condição padrão</dt><dd>'+esc(lab.cond)+'</dd>'+
   (p.tipo?'<dt>Tipo</dt><dd>'+(p.tipo==='mae'?'Pedido mãe':'Remessa de pedido mãe')+'</dd>':'')+
   (p.obs?'<dt>Observação</dt><dd>'+esc(p.obs)+(p.obs.length>=120?'…':'')+'</dd>':'')+
   (p.recObs?'<dt>Obs. do recebimento</dt><dd>'+esc(p.recObs)+'</dd>':'')+
   '</dl><div class="origem">Origem: migrado do sistema antigo (referência '+esc(p.leg||'—')+'). Observações cortadas em 120 letras neste modelo.</div></div>';
  h+='</div>';
  return h;
}

var AVISO={B:'No sistema real, isto abre a tela para anexar o comprovante do nosso pagamento desta parcela.',P:'No sistema real, isto prepara a mensagem de cobrança de baixa para o laboratório, com o comprovante anexado.',V:'No sistema real, isto abre a tela para registrar o pagamento e anexar o comprovante.',A:'No sistema real, isto abre a tela para registrar o pagamento e anexar o comprovante.',itens:'No sistema real, isto abre o pedido para lançar os produtos e quantidades.',novo:'Novo pedido ainda não faz parte deste modelo. Vem na próxima etapa.'};
var tAviso;
function avisar(t){var a=$('#aviso');a.textContent=t;a.classList.add('on');clearTimeout(tAviso);tAviso=setTimeout(function(){a.classList.remove('on')},4200)}

var ultimoFoco=null;
function abrirFicha(i){
  var f=$('#ficha'); ultimoFoco=document.activeElement;
  f.innerHTML=ficha(PED[i]); f.classList.add('on'); f.setAttribute('aria-hidden','false'); $('#veu').classList.add('on');
  $('.f-corpo',f).scrollTop=0; $('#fechar').focus();
}
function fecharFicha(){var f=$('#ficha');f.classList.remove('on');f.setAttribute('aria-hidden','true');$('#veu').classList.remove('on');if(ultimoFoco&&ultimoFoco.focus)ultimoFoco.focus()}

function render(){
  var t=estado.tela, el=$('#tela');
  document.querySelectorAll('.aba[data-ir]').forEach(function(b){if(b.dataset.ir===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  el.innerHTML=t==='pedidos'?telaPedidos():t==='pagamentos'?telaPagamentos():telaInicio();
}
function ir(t){estado.tela=t;try{history.replaceState(null,'','#'+t)}catch(e){}render();window.scrollTo(0,0)}

document.addEventListener('click',function(e){
  var b=e.target.closest('button,[data-p]'); if(!b) return;
  if(b.dataset.ir){estado.especial='';estado.grupo='';ir(b.dataset.ir);return}
  if(b.id==='novo'){avisar(AVISO.novo);return}
  if(b.id==='fechar'){fecharFicha();return}
  if(b.id==='tema'){trocaTema();return}
  if(b.dataset.card){var c=b.dataset.card.split(':');
    if(c[0]==='pedidos'){estado.especial=c[1];estado.sit='';estado.lab='';estado.acao=false;estado.busca='';estado.lim=60;ir('pedidos')}
    else{estado.grupo=c[1];estado.abertos={};estado.unid='';ir('pagamentos');var g=$('#g-'+c[1]);if(g)g.scrollIntoView({block:'start'})}
    return}
  if(b.dataset.sit&&b.classList.contains('barra')){estado.especial='';estado.sit=b.dataset.sit;estado.lab='';estado.acao=false;estado.lim=60;ir('pedidos');return}
  if(b.dataset.f){var f=b.dataset.f,v=b.dataset.v;
    if(f==='sit')estado.sit=v; else if(f==='lab')estado.lab=v; else if(f==='acao')estado.acao=!estado.acao; else if(f==='esp')estado.especial='';
    estado.lim=60;render();return}
  if(b.id==='maisPed'){estado.lim+=60;render();return}
  if(b.dataset.g){var id=b.dataset.g;var cur=b.getAttribute('aria-expanded')==='true';estado.abertos[id]=!cur;render();return}
  if(b.dataset.mais){estado.abertos['lim'+b.dataset.mais]=(estado.abertos['lim'+b.dataset.mais]||25)+50;render();return}
  if(b.dataset.acao){avisar(AVISO[b.dataset.acao]||AVISO.A);return}
  if(b.dataset.p!==undefined){abrirFicha(+b.dataset.p);return}
});
$('#veu').addEventListener('click',fecharFicha);
document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharFicha()});
document.addEventListener('input',function(e){
  if(e.target.id==='busca'){estado.busca=e.target.value;estado.lim=60;var pos=e.target.selectionStart;render();var n=$('#busca');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
});
document.addEventListener('change',function(e){if(e.target.id==='unid'){estado.unid=e.target.value;render()}});

/* tema */
var TEMAS=['auto','light','dark'],NOME_T={auto:'automático',light:'claro',dark:'escuro'},tema='auto';
try{tema=localStorage.getItem('dh-tema')||'auto'}catch(e){}
function aplicaTema(){if(tema==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',tema);$('#tema').textContent='Tema: '+NOME_T[tema]}
function trocaTema(){tema=TEMAS[(TEMAS.indexOf(tema)+1)%3];try{localStorage.setItem('dh-tema',tema)}catch(e){}aplicaTema()}
aplicaTema();

fetch('dados.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
  D=d; preparar();
  var h=(location.hash||'').slice(1); estado.tela=['pedidos','pagamentos'].indexOf(h)>=0?h:'inicio'; render();
}).catch(function(err){$('#tela').innerHTML='<p class="vazio">Não foi possível carregar os dados ('+esc(err.message)+').</p>'});
})();
</script>
